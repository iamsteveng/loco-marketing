    text-align: center;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.55);
  }
  .hero-content {
    position: relative;
    z-index: 2;
  }
  .hero-logo {
    height: 64px;
    margin-bottom: 18px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
  }
  .hero h1 {
    font-size: 26px;
    font-weight: 800;
    color: var(--purple-dark);
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }
  .hero p {
    font-size: 14px;
    color: var(--dark-grey);
    max-width: 480px;
    margin: 0 auto;
    font-weight: 500;
  }
  .instructions {
    max-width: 480px;
    margin: 14px auto 0;
    text-align: left;
  }
  .instructions p {
    font-size: 13px;
    color: var(--purple-dark);
    font-weight: 600;
    line-height: 1.8;
    margin: 0;
  }

  /* Layout */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  .layout {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Map panel (full width, on top) */
  .map-panel {
    background: #fff;
    border: 1.5px solid var(--border-c);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
  }
  .map-frame {
    width: 100%;
    height: 460px;
    border: none;
    display: block;
    background: linear-gradient(180deg, #EAF2FB 0%, #F5F9FC 100%);
    transition: height 0.3s ease;
  }
  .map-panel.expanded .map-frame {
    height: 780px;
  }
  @media (max-width: 600px) {
    .map-frame { height: 360px; }
    .map-panel.expanded .map-frame { height: 560px; }
  }
  .map-expand-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1.5px solid var(--border-c);
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--purple-dark);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(123,104,181,0.15);
    transition: background 0.15s ease;
  }
  .map-expand-btn:hover {
    background: var(--light-grey);
  }
  .map-expand-btn .icon {
    font-size: 14px;
    line-height: 1;
  }
  .map-frame .pin {
    cursor: pointer;
  }
  .map-frame .pin circle.bg {
    fill: #7B68B5;
    stroke: #fff;
    stroke-width: 2.5;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    transition: r 0.15s ease;
  }
  .map-frame .pin.active circle.bg {
    fill: #F0897E;
  }
  .map-frame .pin:hover circle.bg {
    r: 13;
  }
  .map-frame .pin text {
    fill: #fff;
    font-size: 12px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .map-frame .pin-label {
    font-size: 11px;
    font-weight: 700;
    fill: #443D5C;
    text-anchor: middle;
    pointer-events: none;
  }
  .map-frame .district-label {
    font-size: 10px;
    fill: #A8A0C0;
    text-anchor: middle;
  }

  /* Station list (below map, horizontal cards) */
  .station-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }
  .station-card {
    background: #fff;
    border: 1.5px solid var(--border-c);
    border-radius: 16px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .station-card:hover {
    border-color: var(--purple-light);
    box-shadow: 0 4px 14px rgba(123,104,181,0.12);
    transform: translateY(-1px);
  }
  .station-card.active {
    border-color: var(--purple-light);
    background: linear-gradient(135deg, #F8F6FD 0%, #F0EBFA 100%);
    box-shadow: 0 4px 14px rgba(123,104,181,0.18);
  }
  .station-card .name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .station-card .dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--coral);
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(240,137,126,0.18);
  }
  .station-card .name {
    font-size: 15px;
    font-weight: 800;
    color: var(--purple-dark);
  }
  .station-card .address {
    font-size: 12.5px;
    color: var(--mid-grey);
    margin-bottom: 8px;
  }
  .station-card .meta {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--mid-grey);
  }
  .station-card .meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Map info / details box (below map) */
  .map-info {
    background: #fff;
    border: 1.5px solid var(--border-c);
    border-radius: 16px;
    padding: 20px 24px;
  }
  .map-info h2 {
    font-size: 18px;
    font-weight: 800;
    color: var(--purple-dark);
    margin-bottom: 6px;
  }
  .map-info .addr {
    font-size: 13px;
    color: var(--mid-grey);
    margin-bottom: 14px;
  }
  .map-info .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--purple-light); color: #fff; }
  .btn-primary:hover { background: var(--purple-dark); }
  .btn-secondary { background: #fff; color: var(--purple-dark); border: 1.5px solid var(--border-c); }

  .hours-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px,1fr));
    gap: 6px;
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--mid-grey);
  }
  .hours-grid div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #ddd6ee; }

  footer {
    text-align: center;
    padding: 28px 0 40px;
    font-size: 12px;
    color: var(--mid-grey);
  }
</style>
</head>

// Calibrated using an affine fit against 4 known real-world district centroids
// (Yuen Long, Tuen Mun, Eastern/North Point, Sha Tin) matched to their true
// positions on the real Hong Kong 18-district boundary map.
function project(lat, lng) {
  const x = 1052.297 * lng + 168.034 * lat + -123554.332;
  const y = -59.141 * lng + -1302.211 * lat + 36089.735;
  return { x, y };
}

function initMap() {
  const svg = document.getElementById('mapFrame');

  // Render the real Hong Kong 18-district map as the base layer
  let districtsHtml = `
    <defs>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#D9E8F5"/>
        <stop offset="100%" stop-color="#EAF2FB"/>
      </linearGradient>
    </defs>
    <rect x="-45" y="-20" width="650" height="625" fill="url(#seaGrad)" />
  `;
  HK_DISTRICT_PATHS.forEach(d => {
    districtsHtml += `<path d="${d}" fill="#E3DEF0" stroke="#C7BEE0" stroke-width="1" fill-opacity="0.9" />`;
  });

  let html = districtsHtml + `
    <text x="300" y="-2" class="district-label" style="font-size:13px;font-weight:700;fill:#7B68B5;">香港 Hong Kong</text>
  `;

  stations.forEach((s, i) => {
    const { x, y } = project(s.lat, s.lng);
    html += `
      <g class="pin" data-index="${i}" transform="translate(${x},${y})">
        <circle class="bg" r="11" />
        <text dy="1">🚲</text>
      </g>
      <text x="${x}" y="${y + 24}" class="pin-label">${s.name}</text>
    `;
  });

  svg.innerHTML = html;

  svg.querySelectorAll('.pin').forEach(pin => {
    pin.addEventListener('click', () => {
      activeIndex = parseInt(pin.dataset.index);
      renderList();
      renderInfo();
      updatePins();
    });
  });

  updatePins();
}

function updatePins() {
  document.querySelectorAll('#mapFrame .pin').forEach(pin => {
    const i = parseInt(pin.dataset.index);
    pin.classList.toggle('active', i === activeIndex);
  });
}

function renderInfo() {
  const s = stations[activeIndex];
  const info = document.getElementById('mapInfo');
  let hoursHtml = '';
  if (s.weekday_hours && s.weekday_hours.length > 0) {
    hoursHtml = `<div class="hours-grid">${s.weekday_hours.map(h => {
      const [day, time] = h.split(': ');
      return `<div><span>${day}</span><span>${time}</span></div>`;
    }).join('')}</div>`;
  }

  info.innerHTML = `
    <h2>${s.fullName}</h2>
    <div class="addr">📍 ${s.address}</div>
    ${hoursHtml}
    <div class="actions">
      <a class="btn btn-primary" href="${s.mapsUrl}" target="_blank">🧭 開啟 Google Maps</a>
      ${s.phone ? `<a class="btn btn-secondary" href="tel:${s.phone}">📞 ${s.phone}</a>` : ''}
    </div>
  `;
}

const mapPanel = document.getElementById('mapPanel');
const mapExpandBtn = document.getElementById('mapExpandBtn');
const mapExpandIcon = document.getElementById('mapExpandIcon');
const mapExpandText = document.getElementById('mapExpandText');

mapExpandBtn.addEventListener('click', () => {
  const isExpanded = mapPanel.classList.toggle('expanded');
  mapExpandIcon.textContent = isExpanded ? '⤡' : '⤢';
  mapExpandText.textContent = isExpanded ? '縮小地圖' : '放大地圖';
});

renderList();
initMap();
renderInfo();
</script>
